<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AtelierAI - Fashion Design Studio</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: #1a1a1a;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      #root {
        text-align: center;
        padding: 20px;
      }
      h1 {
        color: #d4af37;
        margin-bottom: 20px;
        font-size: 3rem;
      }
      p {
        font-size: 1.2rem;
        margin-bottom: 20px;
        color: #999;
      }
      button {
        padding: 12px 30px;
        background: #d4af37;
        color: #1a1a1a;
        border: none;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
        font-size: 1rem;
      }
      button:hover {
        background: #f0e68c;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <h1>✦ AtelierAI ✦</h1>
      <p>Fashion Design Studio</p>
      <button onclick="alert('React not loading - checking build...')">Test Button</button>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
